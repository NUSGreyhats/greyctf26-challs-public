{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
  <h1>Log in</h1>
  <form id="authform" method="post" action="{{ url_for('login') }}">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="off" autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="off">
    <input type="hidden" name="username" id="username_field">
    <input type="hidden" name="key" id="key">
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('register') }}">Register</a>.</p>
  <p class="muted">Your key is derived in the browser; the server never sees your password.</p>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    const form = document.getElementById("authform");
    const uEl = document.getElementById("username");
    const pEl = document.getElementById("password");
    const uField = document.getElementById("username_field");
    const kEl = document.getElementById("key");

    uEl.value = localStorage.getItem("notes_username") || "";
    pEl.value = localStorage.getItem("notes_password") || "";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const u = uEl.value.trim();
      const p = pEl.value;
      if (!u || !p) return;
      kEl.value = await deriveKeyHex(u, p);
      uField.value = b64encodeUtf8(u);
      notesStore(u, p);
      form.submit();
    });
  })();
</script>
{% endblock %}
