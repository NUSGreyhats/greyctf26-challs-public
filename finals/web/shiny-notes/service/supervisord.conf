[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:mysql]
command=mysqld --user=mysql
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
command=/opt/venv/bin/python -m gunicorn --workers 1 --threads 8 --bind 127.0.0.1:8080 app:app
directory=/app
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:varnish]
command=varnishd -F -f /etc/varnish/default.vcl -a http=:80,HTTP -a proxy=:6086,PROXY -p feature=+http2 -s malloc,64m
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:hitch]
command=hitch --config /etc/hitch/hitch.conf
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bot]
command=/opt/venv/bin/python /bot/bot.py
environment=CHROMIUM_PATH="/usr/bin/chromium"
autostart=true
startsecs=10
startretries=5
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
