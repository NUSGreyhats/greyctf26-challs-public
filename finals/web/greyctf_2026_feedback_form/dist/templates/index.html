<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Feedback</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #202124;
                font-family: sans-serif;
            }

            form {
                display: grid;
                gap: 12px;
                width: min(90vw, 420px);
            }

            img {
                display: block;
                width: 100%;
                max-height: 160px;
                object-fit: contain;
            }

            textarea {
                min-height: 160px;
                padding: 14px;
                resize: vertical;
                border: 1px solid #5f6368;
                border-radius: 8px;
                background: #2f3033;
                color: #f1f3f4;
                font: inherit;
            }

            button {
                padding: 10px 14px;
                border: 0;
                border-radius: 8px;
                background: #f1f3f4;
                color: #202124;
                font: inherit;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <form method="post" action="/api/feedback">
            <img src="/title.png" alt="Feedback" />
            <textarea
                name="feedback"
                placeholder="This is a safe space! Say whatever!"
            ></textarea>
            <button>Submit</button>
        </form>
    </body>
</html>
