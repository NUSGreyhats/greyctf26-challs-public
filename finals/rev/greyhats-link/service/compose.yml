services:
  challenge:
    build: .
    image: greyhats-link:latest
    entrypoint: ["/bin/true"]
    command: []
    ports:
      - "32067:80"
    mem_limit: 256m
    cpus: 0.5
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
